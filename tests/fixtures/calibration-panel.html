<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba local de calibración Circadian Pro</title>
<style>
  body { margin:0; height:100vh; background:#f5f7fa; font-family:system-ui; --primary-color:#0077ab; --primary-background-color:#fafafa; }
  body.dark { --primary-color:#70c5fa; --primary-background-color:#081018; --primary-text-color:#e1e9f1; --secondary-text-color:#a6b3c2; --card-background-color:#141e29; --secondary-background-color:#202d3b; --divider-color:#344355; }
  .notice { height:38px; box-sizing:border-box; padding:6px 20px; background:#e8f0fe; color:#204779; font-size:13px; display:flex; align-items:center; gap:8px; }
  .notice button { margin-left:auto; }
  circadian-pro-calibration { height:calc(100vh - 38px); display:block; }
</style>
<div class="notice">Prueba local · No controla tus luces. <span id="demo-status">Vista simulada detenida.</span><button id="theme-toggle" type="button">Tema oscuro</button></div>
<circadian-pro-calibration></circadian-pro-calibration>
<script type="module">
  import '../../custom_components/circadian_pro/frontend/calibration-panel.js';
  const translationDocument = await (await fetch('../../custom_components/circadian_pro/translations/es.json')).json();
  const translations = {...translationDocument.options, selector:translationDocument.selector};
  // Synthetic profiles and lights for UI testing; no installation data.
  const original = {
    lights:['light.example_a'], interval:60, transition:5, initial_transition:0,
    min_color_temp:1200, max_color_temp:4000, min_brightness:100, max_brightness:100,
    brightness_mode:'linear', apply_temperature_curve:false, brightness_mode_time_light_minutes:1, brightness_mode_time_dark_minutes:160,
    white_w_kelvin:3000, white_cw_kelvin:6500, cal_white_kelvin_neutral:4000,
    cal_rgb_neutral_r:255, cal_rgb_neutral_g:255, cal_rgb_neutral_b:255,
    cal_rgb_warm_r:255, cal_rgb_warm_g:56, cal_rgb_warm_b:0,
    cal_white_intensity_neutral:100, cal_white_intensity_warm:0,
    sleep_rgb_color:[255,0,0],sleep_rgb_or_color_temp:'rgb_color',sleep_color_temp:1500,sleep_brightness:80,
    sleep_activation_mode:'schedule',sleep_schedule_start:'21:00:00',sleep_schedule_end:'06:00:00',sunrise_time:'None',
    sunrise_offset_minutes:0,sunset_offset_minutes:0,adapt_delay:0,autoreset_control_seconds:0,send_split_delay:0,
  };
  const steps = ['init','white_channels','cal_neutral','cal_warm'];
  const names = [
    ['lights','interval','transition','initial_transition','min_color_temp','max_color_temp','min_brightness','max_brightness','brightness_mode','apply_temperature_curve','brightness_mode_time_light_minutes','brightness_mode_time_dark_minutes',
      'sleep_activation_mode','sleep_schedule_start','sleep_schedule_end','sleep_brightness','sleep_rgb_or_color_temp','sleep_color_temp','sleep_rgb_color','sunrise_time',
      'sunrise_offset_minutes','sunset_offset_minutes','adapt_delay','autoreset_control_seconds','send_split_delay'],
    ['white_w_kelvin','white_cw_kelvin'],
    ['cal_rgb_neutral_r','cal_rgb_neutral_g','cal_rgb_neutral_b','cal_white_intensity_neutral','cal_white_kelvin_neutral'],
    ['cal_rgb_warm_r','cal_rgb_warm_g','cal_rgb_warm_b','cal_white_intensity_warm'],
  ];
  const flows = new Map();
  const configFlows = new Map();
  const profiles = new Map([
    ['local-profile-a',{entry_id:'local-profile-a',title:'Profile A',modified_at:'2026-10-13T12:00:00Z',settings:original}],
    ['local-profile-b',{entry_id:'local-profile-b',title:'Profile B',modified_at:'2026-10-12T12:00:00Z',settings:{...original,lights:['light.example_b']}}],
    ['local-profile-c',{entry_id:'local-profile-c',title:'Profile C',modified_at:'2026-10-11T12:00:00Z',settings:{...original,lights:['light.example_c']}}],
  ]);
  if (new URLSearchParams(location.search).get('empty') === '1') profiles.clear();
  const metadataListeners = new Set();
  const connectionListeners = new Map();
  const metadata = (profile) => ({entry_id:profile.entry_id,title:profile.title,domain:'circadian_pro',state:'loaded'});
  const notifyMetadata = (profile, type = 'updated') => {
    for(const callback of metadataListeners) callback([{type,entry:metadata(profile)}]);
  };
  let sequence = 0;
  const commands = [];
  // Match production's serialized validators as well as explicit selectors;
  // an unspecified maximum must stay unspecified in this visual fixture.
  const numericFields = {
    interval:{type:'integer',valueMin:0},
    transition:{type:'float',valueMin:0,valueMax:6553},
    initial_transition:{type:'float',valueMin:0,valueMax:6553},
    adapt_delay:{type:'float',valueMin:0},
    autoreset_control_seconds:{type:'integer',valueMin:0,valueMax:31536000},
    send_split_delay:{type:'integer',valueMin:0,valueMax:10000},
    min_brightness:{type:'integer',valueMin:1,valueMax:100},
    max_brightness:{type:'integer',valueMin:1,valueMax:100},
    sleep_brightness:{type:'integer',valueMin:1,valueMax:100},
    min_color_temp:{type:'integer',valueMin:1000,valueMax:10000},
    max_color_temp:{type:'integer',valueMin:1000,valueMax:10000},
    sleep_color_temp:{type:'integer',valueMin:1000,valueMax:10000},
  };
  const numericSchema = (name, defaults) => {
    if (numericFields[name]) return numericFields[name];
    const number = (limits) => ({selector:{number:{mode:'box',step:1,...limits}}});
    if (['sunrise_offset_minutes','sunset_offset_minutes'].includes(name)) return number({});
    if (name.startsWith('brightness_mode_time_')) return number({min:0,max:240});
    if (['white_w_kelvin','white_cw_kelvin'].includes(name)) return number({min:1000,max:10000,step:50});
    if (name.startsWith('cal_rgb_')) return number({min:0,max:255,mode:'slider'});
    if (name.startsWith('cal_white_intensity_')) return number({min:0,max:100,mode:'slider'});
    if (name === 'cal_white_kelvin_neutral') return number({min:defaults.white_w_kelvin,max:defaults.white_cw_kelvin});
    throw Error(`Faltan los metadatos de prueba del campo ${name}.`);
  };
  const form = (id, index, errors = {}, defaults = original) => ({
    flow_id:id, type:'form', step_id:steps[index], last_step:index === 3, errors,
    data_schema:names[index].map((name) => ({ name, default:defaults[name],
      ...(name === 'lights' ? {selector:{entity:{domain:'light',multiple:true}}}
        : name === 'sleep_rgb_color' ? {selector:{color_rgb:{}}}
        : name === 'brightness_mode' ? {selector:{select:{options:['default','linear','tanh'],translation_key:'brightness_mode'}}}
        : name === 'sleep_activation_mode' ? {selector:{select:{options:['disabled','sun','schedule'],translation_key:'sleep_activation_mode'}}}
        : name === 'sleep_rgb_or_color_temp' ? {selector:{select:{options:['rgb_color','color_temp'],translation_key:'sleep_rgb_or_color_temp'}}}
        : name.startsWith('sleep_schedule_') ? {selector:{time:{}}}
        : name === 'apply_temperature_curve' ? {selector:{boolean:{}}}
        : name === 'sunrise_time' ? {type:'string'}
        : numericSchema(name, defaults)),
    })),
  });
  const panel = document.querySelector('circadian-pro-calibration');
  panel.hass = {
    language:'es',user:{is_admin:true},
    connection:{
      addEventListener:(event,callback) => {connectionListeners.set(event,callback);},
      removeEventListener:(event,callback) => {if(connectionListeners.get(event) === callback) connectionListeners.delete(event);},
      subscribeMessage:async(callback,message,options) => {
        if(message.type !== 'config_entries/subscribe') throw Error('Suscripción no admitida en la prueba.');
        if(options.resubscribe !== false) throw Error('La suscripción debe cerrarse incluso sin conexión.');
        metadataListeners.add(callback);
        queueMicrotask(() => callback([...profiles.values()].map((profile) => ({type:null,entry:metadata(profile)}))));
        return async() => {metadataListeners.delete(callback);};
      },
    },
    states:{
      'light.example_a':{attributes:{friendly_name:'Light A',supported_color_modes:['color_temp','rgbww']}},
      'light.example_b':{attributes:{friendly_name:'Light B',supported_color_modes:['rgbw']}},
      'light.example_c':{attributes:{friendly_name:'Light C',supported_color_modes:['rgbw']}},
      'light.example_d':{attributes:{friendly_name:'Light D',supported_color_modes:['rgb']}},
      'light.example_e':{attributes:{friendly_name:'Light E',supported_color_modes:['color_temp','rgbww']}},
      'light.example_f':{attributes:{friendly_name:'Light F',supported_color_modes:['rgb']}},
    },
    callWS:async(message) => {
      commands.push(message);
      if(message.type.endsWith('/entries')) {
        const entries = [...profiles.values()].map((profile) => ({...profile,settings:{...profile.settings}}));
        return message.include_status ? {entries,configured_profiles:profiles.size} : entries;
      }
      if(message.type.endsWith('/translations')) return translations;
      if(message.type.endsWith('/solar')) {
        // Explicit demonstration data; production always requests HA's location.
        const now = new Date();
        const start = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) / 1000;
        const time = (value, fallback) => value && value !== 'None'
          ? value.split(':').reduce((total, part, index) => total + Number(part) * [60, 1, 1/60][index], 0) : fallback;
        const rise = time(message.settings.sunrise_time, 420) + (message.settings.sunrise_offset_minutes || 0);
        const set = time(message.settings.sunset_time, 1100) + (message.settings.sunset_offset_minutes || 0);
        const clock = (minute) => `${String(Math.floor(((minute%1440)+1440)%1440/60)).padStart(2,'0')}:${String(Math.floor(((minute%60)+60)%60)).padStart(2,'0')}`;
        const mode = message.settings.sleep_activation_mode || 'disabled';
        const sleepStart = mode === 'sun' ? set : time(message.settings.sleep_schedule_start, 1260);
        const sleepEnd = mode === 'sun' ? rise : time(message.settings.sleep_schedule_end, 360);
        const sleepAllDay = mode === 'schedule' && sleepStart === sleepEnd;
        const windows = mode === 'disabled' ? [] : sleepAllDay ? [{start:start-172800,end:start+259200}]
          : [-2,-1,0,1,2].map((day) => ({start:start+day*86400+sleepStart*60,end:start+day*86400+(sleepEnd+(sleepEnd<sleepStart?1440:0))*60}));
        const nightMiddle = ((set+rise+1440)/2)%1440;
        return {
          local_date: now.toISOString().slice(0,10), timezone: 'UTC', day_start: start, day_end: start+86400,
          refresh_after: start+86400-Date.now()/1000,
          sleep_mode:mode,sleep_windows:windows,sleep_all_day:sleepAllDay,
          midpoints:[{kind:'day',timestamp:start+(rise+set)*30,local_time:clock((rise+set)/2)},
            {kind:'night',timestamp:start+nightMiddle*60,local_time:clock(nightMiddle)}].sort((a,b)=>a.timestamp-b.timestamp),
          sunrise: {timestamp:start+rise*60,local_time:clock(rise)}, sunset: {timestamp:start+set*60,local_time:clock(set)},
          events: [-2,-1,0,1,2].flatMap((day) => [
            ['solar_midnight',50],['sunrise',rise],['solar_noon',770],['sunset',set],
          ].map(([event,minute]) => ({event,timestamp:start+day*86400+minute*60}))),
        };
      }
      if(message.type.endsWith('/preview')) {
        if(message.settings.white_w_kelvin >= message.settings.white_cw_kelvin) throw Error('El blanco frío debe superar la temperatura del blanco cálido.');
        document.querySelector('#demo-status').textContent = `Vista simulada: ${message.kelvin} K · R ${message.settings[message.kelvin === 4000 ? 'cal_rgb_neutral_r' : 'cal_rgb_warm_r']}.`;
        return {expires_in:60};
      }
      if(message.type.endsWith('/stop')) document.querySelector('#demo-status').textContent = 'Vista simulada detenida.';
      return {};
    },
    callApi:async(method,path,data) => {
      commands.push({method,path,data});
      const id = path.split('/').at(-1);
      if(path === 'config/config_entries/flow') {
        const key = `create-${++sequence}`;
        const step = profiles.size ? 'menu' : 'user';
        configFlows.set(key,{step});
        return {type:'form',flow_id:key,step_id:step,data_schema:step === 'user' ? [{name:'name',required:true,type:'string'}] : []};
      }
      if(path.startsWith('config/config_entries/flow/')) {
        if(method === 'DELETE') {configFlows.delete(id);return {};}
        const creating = configFlows.get(id);
        if(creating.step === 'menu') {
          if(data.action !== 'new') throw Error('La prueba crea perfiles nuevos sin duplicar luces existentes.');
          creating.step = 'user';
          return {type:'form',flow_id:id,step_id:'user',data_schema:[{name:'name',required:true,type:'string'}]};
        }
        const name = data.name.trim();
        if(!name || [...profiles.values()].some((profile) => profile.title === name)) {
          return {type:'form',flow_id:id,step_id:'user',errors:{name:name?'unique_name':'name_required'},data_schema:[]};
        }
        const entryId = `new-profile-${++sequence}`;
        profiles.set(entryId,{entry_id:entryId,title:name,created_at:new Date().toISOString(),modified_at:new Date().toISOString(),settings:{...original,lights:[]}});
        notifyMetadata(profiles.get(entryId),'added');
        configFlows.delete(id);
        return {type:'create_entry',flow_id:id,result:{entry_id:entryId,title:name,state:'loaded'}};
      }
      if(method === 'DELETE') { flows.delete(id); return {}; }
      if(path.endsWith('/flow')) {
        const profile = profiles.get(data.handler);
        if(!profile) throw Error('Perfil inexistente.');
        const key = String(++sequence);
        flows.set(key,{index:0,profile,draft:{...profile.settings}});
        return form(key,0,{},profile.settings);
      }
      const flow = flows.get(id);
      if(flow.index === 0 && !Array.isArray(data.lights)) throw Error('La selección de luces debe conservar una lista, aunque solo haya una luz elegida.');
      if(flow.index === 0 && (!Array.isArray(data.sleep_rgb_color) || data.sunrise_time === null)) throw Error('RGB debe conservar tres canales y el horario opcional su valor vacío.');
      Object.assign(flow.draft,data);
      if(flow.index === 1 && data.white_w_kelvin >= data.white_cw_kelvin) return form(id,1,{base:'invalid_white_channel_range'},flow.draft);
      if(flow.index === 3) { Object.assign(flow.profile.settings,flow.draft);flow.profile.modified_at=new Date().toISOString();notifyMetadata(flow.profile);flows.delete(id);return {type:'create_entry'}; }
      flow.index++;
      return form(id,flow.index,{},flow.draft);
    },
  };
  // A read-only inspection hook for automated local UI checks.
  window.calibrationDemoCommands = commands;
  document.querySelector('#theme-toggle').addEventListener('click', (event) => {
    const dark = document.body.classList.toggle('dark');
    event.currentTarget.textContent = dark ? 'Tema claro' : 'Tema oscuro';
  });
  window.calibrationDemoAddProfile = (name) => {
    const id = `external-${++sequence}`;
    const profile = {entry_id:id,title:name,settings:{...original,lights:[]}};
    profiles.set(id,profile);
    notifyMetadata(profile,'added');
  };
</script>
</html>
