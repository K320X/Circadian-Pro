# Descriptions for Circadian Pro actions.
# Modified for Circadian Pro. See NOTICE and LICENSE-APACHE-2.0.txt.
apply:
  fields:
    entity_id:
      selector:
        entity:
          integration: circadian_pro
          domain: switch
          multiple: false
    lights:
      selector:
        entity:
          domain: light
          multiple: true
    transition:
      example: 10
      selector:
        text: null
    adapt_brightness:
      example: true
      selector:
        boolean: null
    adapt_color:
      example: true
      selector:
        boolean: null
    prefer_rgb_color:
      example: false
      selector:
        boolean: null
    turn_on_lights:
      example: false
      selector:
        boolean: null
set_manual_control:
  fields:
    entity_id:
      selector:
        entity:
          integration: circadian_pro
          domain: switch
          multiple: false
    lights:
      selector:
        entity:
          domain: light
          multiple: true
    manual_control:
      example: true
      default: "true"
      selector:
        select:
          options:
          - "true"
          - "false"
          - brightness
          - color
          translation_key: manual_control
change_switch_settings:
  fields:
    brightness_mode:
      required: false
      selector:
        select:
          options:
          - default
          - linear
          - tanh
          translation_key: brightness_mode
    apply_temperature_curve:
      required: false
      example: false
      selector:
        boolean: null
    brightness_mode_time_light:
      required: false
      selector:
        number:
          min: 0
          step: 1
          mode: box
    brightness_mode_time_dark:
      required: false
      selector:
        number:
          min: 0
          step: 1
          mode: box
    entity_id:
      required: true
      selector:
        entity:
          domain: switch
    use_defaults:
      example: current
      required: false
      default: current
      selector:
        select:
          translation_key: use_defaults
          options:
          - current
          - configuration
          - factory
    include_config_in_attributes:
      required: false
      selector:
        boolean: null
    white_w_kelvin:
      required: false
      example: 3000
      selector:
        number:
          min: 1000
          max: 10000
          step: 50
          mode: box
    white_cw_kelvin:
      required: false
      example: 6500
      selector:
        number:
          min: 1000
          max: 10000
          step: 50
          mode: box
    cal_white_kelvin_neutral:
      required: false
      example: 4000
      selector:
        number:
          min: 1000
          max: 10000
          step: 50
          mode: box
    turn_on_lights:
      example: false
      required: false
      selector:
        boolean: null
    initial_transition:
      example: 1
      required: false
      selector:
        text: null
    sleep_transition:
      example: 1
      required: false
      selector:
        text: null
    max_brightness:
      required: false
      example: 100
      selector:
        text: null
    max_color_temp:
      required: false
      example: 5500
      selector:
        text: null
    min_brightness:
      required: false
      example: 1
      selector:
        text: null
    min_color_temp:
      required: false
      example: 2000
      selector:
        text: null
    only_once:
      example: false
      required: false
      selector:
        boolean: null
    prefer_rgb_color:
      required: false
      example: false
      selector:
        boolean: null
    separate_turn_on_commands:
      required: false
      example: false
      selector:
        boolean: null
    send_split_delay:
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 10000
          step: 1
          mode: box
    sleep_brightness:
      required: false
      example: 1
      selector:
        text: null
    sleep_rgb_or_color_temp:
      required: false
      example: color_temp
      selector:
        select:
          translation_key: sleep_rgb_or_color_temp
          options:
          - rgb_color
          - color_temp
    sleep_rgb_color:
      required: false
      selector:
        color_rgb: null
    sleep_color_temp:
      required: false
      example: 1000
      selector:
        text: null
    sunrise_offset:
      required: false
      example: 0
      selector:
        number:
          min: -86300
          max: 86300
          step: 1
          mode: box
    sunrise_time:
      required: false
      example: ''
      selector:
        time: null
    sunset_offset:
      required: false
      example: ''
      selector:
        number:
          min: -86300
          max: 86300
          step: 1
          mode: box
    sunset_time:
      example: ''
      required: false
      selector:
        time: null
    max_sunrise_time:
      example: ''
      required: false
      selector:
        time: null
    min_sunset_time:
      example: ''
      required: false
      selector:
        time: null
    take_over_control:
      required: false
      example: true
      selector:
        boolean: null
    take_over_control_mode:
      required: false
      example: pause_changed
      selector:
        select:
          translation_key: take_over_control_mode
          options:
          - pause_all
          - pause_changed
    detect_non_ha_changes:
      required: false
      example: false
      selector:
        boolean: null
    transition:
      required: false
      example: 45
      selector:
        text: null
    adapt_delay:
      required: false
      example: 0
      selector:
        text: null
    autoreset_control_seconds:
      required: false
      example: 0
      selector:
        text: null
